<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Animaux.css">
</head>
<body>
    <section>
                <div class="filtres">
                    <div class="filtre">
                        <label for="espece">Espèce</label>
                        <select name="espece" id="espece">
                            <option value="all">Tous les animaux</option>
                            <option value="chien">Chiens</option>
                            <option value="chat">Chats</option>
                            <option value="lapin">Lapins</option>
                            <option value="perruche">Perruche</option>
                        </select>
                    </div>
                    <div class="filtre">
                        <label for="refuges" >Refuge</label>
                        <select name="refuge" id="refuges">
                            <option value="all">Tous les refuges</option>
                            <option value="croix-bleu">La croix bleu</option>
                            <option value="srpa-veeweyde">SRPA Veeweyde</option>
                            <option value="help-animals">Help Animals</option>
                            <option value="sans-collier">Sans Collier</option>
                            <option value="srpa-liege">SRPA Liège</option>
                        </select>
                    </div>
                    <div class="filtre">
                        <label for="age">Âge</label>
                        <select name="age" id="age">
                            <option value="all">Tous les âges</option>
                            <option value="1-an">Moins de 1 an</option>
                            <option value="1-3">1 à 3 ans</option>
                            <option value="3-5">3 à 5 ans</option>
                            <option value="5-plus">Plus de 5 ans</option>
                            <option value="inconnue">Inconnue</option>
                        </select>
                    </div>
                    <div class="filtre">
                        <label for="taille">Taille</label>
                        <select name="taille" id="taille">
                            <option value="all">Tous les tailles</option>
                            <option value="petit">Petit</option>
                            <option value="moyen">Moyen</option>
                            <option value="grand">Grand</option>
                        </select>
                    </div>
                    <div class="filtre">
                        <label for="sexe">Sexe</label>
                        <select name="sexe" id="sexe">
                            <option value="all">Tous les animaux</option>
                            <option value="femelle">Femelle</option>
                            <option value="male">Mâle</option>
                        </select>
                    </div>
                    <div class="filtre">
                        <label for="inseparable">Inséparables</label>
                        <select name="inseparable" id="inseparable">
                            <option value="all">Tous les animaux</option>
                            <option value="ensemble">À adopter ensemble</option>
                            <option value="individuelle">Adoption individuelle possible</option>
                        </select>
                    </div>
                </div>
            </section>
</body>
</html>
